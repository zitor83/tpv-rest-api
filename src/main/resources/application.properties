spring.application.name=tpv-backend

# Activa el perfil 'local' para usar H2 en desarrollo.
# En produccion, esta propiedad se puede sobreescribir con una variable de entorno: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=prod

# Server
server.port=8081

# H2 console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# PostgreSQL (usado por perfiles 'prod' o cuando no hay otro perfil activo)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tpv}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Se anade el dialecto de PostgreSQL para eliminar la ambiguedad de Hibernate.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL init
spring.sql.init.mode=always

# OpenAPI / Swagger (Spring Boot 3 con springdoc-openapi)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT (reemplazar defaults en entornos reales)
security.jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-chars}
security.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
security.jwt.issuer=${JWT_ISSUER:tpv-backend}

# Jackson - Register java.time module for proper serialization of Instant
spring.jackson.default-property-inclusion=non_null

spring.application.name=tpv-backend

# Selecciona el perfil por variable de entorno (ej. SPRING_PROFILES_ACTIVE=local o prod).

# Server
server.port=8081

# H2 console (deshabilitada fuera de local)
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# PostgreSQL (obligatorio fuera de local)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Se anade el dialecto de PostgreSQL para eliminar la ambiguedad de Hibernate.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL init
spring.sql.init.mode=always

# OpenAPI / Swagger (Spring Boot 3 con springdoc-openapi)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT (obligatorio por variable de entorno)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
security.jwt.issuer=${JWT_ISSUER:tpv-backend}

# Jackson - Register java.time module for proper serialization of Instant
spring.jackson.default-property-inclusion=non_null

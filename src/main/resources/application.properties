spring.application.name=tpv-backend

# Server
server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tpv}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL init
spring.sql.init.mode=always

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (reemplazar defaults en entornos reales)
security.jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-chars}
security.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
security.jwt.issuer=${JWT_ISSUER:tpv-backend}

